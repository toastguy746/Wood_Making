<script>
const RED='fill="#ff2a2a" stroke="#000" stroke-width="0.5" font-weight="700"';
const NAMES=[]; // 판 이름(수정한 것)
const FIX=[]; // 판 고정 여부(고정된 판은 재배치에서 제외)
const escA=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const RS=32; // 빨간 숫자 크기(항상 일정)
const COL=['#2e9e5b','#f08a24','#3b82d6','#d6453b','#8e5bd0','#e0b81d','#1fa7a7','#d6559b','#7a9a2a','#8a6a4a'];
function pack(items,W,H,k,m,fl){
  const S=[{free:[{x:0,y:0,w:W,h:H,cut:null}],p:[],cuts:[]}];
  for(const it of items){
    let done=false;
    for(const s of S){ if(place(s,it,k,m,fl)){done=true;break;} }
    if(!done){const s={free:[{x:0,y:0,w:W,h:H,cut:null}],p:[],cuts:[]};S.push(s);place(s,it,k,m,fl);}
  }
  return S;
}
function place(s,it,k,m=0,fl=false){
  let bi=-1,bs=1e9;
  s.free.forEach((f,i)=>{ if(it.w<=f.w&&it.h<=f.h){const dw=f.w-it.w,dh=f.h-it.h,sc=m===1?Math.max(dw,dh):m===2?f.w*f.h-it.w*it.h:m===3?f.y*100000+f.x:Math.min(dw,dh); if(sc<bs){bs=sc;bi=i;}}});
  if(bi<0)return false;
  const f=s.free.splice(bi,1)[0];
  s.p.push({...it,x:f.x,y:f.y});
  const rw=f.w-it.w,rh=f.h-it.h,n=[];
  const hz=(rw<rh)!==fl; // true: 가로 절단을 먼저, false: 세로 절단을 먼저
  const mkH=w=>rh>0?{d:'h',x1:f.x,y1:f.y+it.h+k/2,x2:f.x+w,y2:f.y+it.h+k/2}:null;
  const mkV=h=>rw>0?{d:'v',x1:f.x+it.w+k/2,y1:f.y,x2:f.x+it.w+k/2,y2:f.y+h}:null;
  let c1,c2;
  if(hz){c1=mkH(f.w);c2=mkV(it.h);}else{c1=mkV(f.h);c2=mkH(it.w);}
  if(c1){c1.par=f.cut||null;s.cuts.push(c1);}
  if(c2){c2.par=c1||f.cut||null;s.cuts.push(c2);}
  const cR=hz?c2:c1,cB=hz?c1:c2; // 오른쪽/아래쪽 남는 조각을 만든 절단선
  if(hz){ n.push({x:f.x+it.w+k,y:f.y,w:rw-k,h:it.h,cut:cR},{x:f.x,y:f.y+it.h+k,w:f.w,h:rh-k,cut:cB}); }
  else { n.push({x:f.x+it.w+k,y:f.y,w:rw-k,h:f.h,cut:cR},{x:f.x,y:f.y+it.h+k,w:it.w,h:rh-k,cut:cB}); }
  n.forEach(r=>{if(r.w>0&&r.h>0)s.free.push(r);});
  return true;
}

/* ───── 남은 공간을 최소한의 사각형으로 합치기 ─────
   1) 부재 배치가 끝난 판에서, 부재(+톱날 두께)가 차지한 곳을 뺀 나머지를 격자로 만들고
   2) 그 나머지를 가장 적은 수의 사각형으로 나눈 뒤
   3) 사각형끼리 맞닿는 면은 톱날 두께만큼 깎아서 실제 재단 가능한 크기로 만든다 */
function strips(g,X,Y){ // 가로줄 단위로 만들고 같은 폭이면 위아래로 합침
  const out=[];let open=[];
  for(let i=0;i<=g.length;i++){
    const runs=[];
    if(i<g.length){let j=0;const row=g[i];while(j<row.length){if(!row[j]){j++;continue;}const a=j;while(j<row.length&&row[j])j++;runs.push({a,b:j,used:false});}}
    const next=[];
    open.forEach(o=>{
      const r=runs.find(r=>!r.used&&r.a===o.a&&r.b===o.b);
      if(r){r.used=true;next.push(o);}
      else out.push({x:X[o.a],y:Y[o.i0],w:X[o.b]-X[o.a],h:Y[i]-Y[o.i0]});
    });
    runs.forEach(r=>{if(!r.used)next.push({a:r.a,b:r.b,i0:i});});
    open=next;
  }
  return out;
}
function stripsCol(g,X,Y){ // 세로줄 단위(전치해서 같은 방식 적용)
  const R=g.length,C=R?g[0].length:0;
  const t=Array.from({length:C},(_,j)=>Array.from({length:R},(_,i)=>g[i][j]));
  return strips(t,Y,X).map(r=>({x:r.y,y:r.x,w:r.h,h:r.w}));
}
function greedyBig(g,X,Y){ // 가장 큰 사각형부터 계속 떼어냄
  const R=g.length,C=R?g[0].length:0,m=g.map(r=>r.slice()),out=[];
  for(;;){
    const dn=Array.from({length:R+1},()=>new Array(C).fill(0));
    for(let i=R-1;i>=0;i--)for(let j=0;j<C;j++)dn[i][j]=m[i][j]?dn[i+1][j]+1:0;
    let best=null,ba=0;
    for(let i=0;i<R;i++)for(let j=0;j<C;j++){
      if(!m[i][j])continue;
      let md=1e9;
      for(let j2=j;j2<C&&m[i][j2];j2++){
        md=Math.min(md,dn[i][j2]);
        const a=(X[j2+1]-X[j])*(Y[i+md]-Y[i]);
        if(a>ba){ba=a;best={i,j,j2,md};}
      }
    }
    if(!best)break;
    out.push({x:X[best.j],y:Y[best.i],w:X[best.j2+1]-X[best.j],h:Y[best.i+best.md]-Y[best.i]});
    for(let i=best.i;i<best.i+best.md;i++)for(let j=best.j;j<=best.j2;j++)m[i][j]=false;
  }
  return out;
}
function kerfTrim(rs,k){ // 서로 맞닿은 면은 작은 쪽을 톱날 두께만큼 깎음
  rs.sort((a,b)=>b.w*b.h-a.w*a.h);
  const o=rs.map(r=>({...r}));
  const res=rs.map(()=>({l:0,r:0,t:0,b:0}));
  for(let b=1;b<rs.length;b++){
    const B=o[b],f=res[b];
    for(let a=0;a<b;a++){
      const A=o[a];
      const yo=Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y);
      const xo=Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x);
      if(yo>0){ if(A.x+A.w===B.x)f.l=k; else if(B.x+B.w===A.x)f.r=k; }
      if(xo>0){ if(A.y+A.h===B.y)f.t=k; else if(B.y+B.h===A.y)f.b=k; }
    }
  }
  return rs.map((r,i)=>{const f=res[i];return{x:r.x+f.l,y:r.y+f.t,w:r.w-f.l-f.r,h:r.h-f.t-f.b};}).filter(r=>r.w>0&&r.h>0);
}
function leftover(p,W,H,k){
  const occ=p.map(q=>({x0:Math.max(0,q.x-k),y0:Math.max(0,q.y-k),x1:Math.min(W,q.x+q.w+k),y1:Math.min(H,q.y+q.h+k)}));
  const xs=new Set([0,W]),ys=new Set([0,H]);
  occ.forEach(o=>{xs.add(o.x0);xs.add(o.x1);ys.add(o.y0);ys.add(o.y1);});

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const now=new Date();
  const dt=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dd=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const f of files){
    const nb=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;

    lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);
    lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);

    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);
    ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nb);
    off+=30+nb.length+sz;
  }
  let cs=0;cen.forEach(x=>cs+=x.byteLength);

  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

function sheetBlob(svg,jpg){
  return new Promise((ok,no)=>{
    const vb=svg.viewBox.baseVal,W=vb.width,H=vb.height;

    const c=svg.cloneNode(true);

    c.setAttribute('font-family',"system-ui,'Malgun Gothic',sans-serif");
    const src=new XMLSerializer().serializeToString(c).replace(/var\(--sheet\)/g,sheetColor);
    const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>b?ok(b):no(new Error('toBlob')),jpg?'image/jpeg':'image/png',0.92);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('img'));};
    img.src=url;
  });
}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
let SBMODE='d';
function sbOpen(m){
  SBMODE=m;$('sbmain').style.display='none';$('sbopt').style.display='flex';
  $('sbgo').textContent=m==='d'?'저장':'인쇄';$('smsg').textContent='';
}
function sbClose(){$('sbopt').style.display='none';$('sbmain').style.display='flex';$('smsg').textContent='';}
function sbGo(){if(SBMODE==='d')saveImages();else printImages();}
async function printImages(){
  const sm=$('smsg');
  const cards=[...document.querySelectorAll('#sheets .sh')],svgs=cards.map(c=>c.querySelector('svg'));
  if(!svgs.length||!validRows().length){sm.textContent='인쇄할 배치가 없습니다.';return;}
  const jpg=$('ifmt').value==='jpg';
  const base=($('iname').value.trim()||$('pname').value.trim()||'재단배치').replace(/[\\/:*?"<>|]/g,'_');
  sm.textContent='인쇄 준비 중...';
  const pa=$('printArea'),urls=[];
  try{
    pa.innerHTML='';
    for(const s of svgs){
      const url=URL.createObjectURL(await sheetBlob(s,jpg));urls.push(url);
      const img=new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url;});
      pa.appendChild(img);
    }
    const oldT=document.title;document.title=base;
    const done=()=>{document.title=oldT;pa.innerHTML='';urls.forEach(u=>URL.revokeObjectURL(u));window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);
    sm.textContent='';
    window.print();
  }catch(e){sm.textContent='인쇄할 이미지를 만들지 못했습니다.';pa.innerHTML='';}
}
async function saveImages(){
  const sm=$('smsg');
  const cards=[...document.querySelectorAll('#sheets .sh')],svgs=cards.map(c=>c.querySelector('svg'));
  if(!svgs.length||!validRows().length){sm.textContent='저장할 배치가 없습니다.';return;}
  const jpg=$('ifmt').value==='jpg',ext=jpg?'jpg':'png';
  const base=($('iname').value.trim()||$('pname').value.trim()||'재단배치').replace(/[\\/:*?"<>|]/g,'_');
  sm.textContent='저장 중...';
  try{
    if(svgs.length===1){
      download(await sheetBlob(svgs[0],jpg),base+'.'+ext);
      sm.textContent=base+'.'+ext+' 저장';
    }else{
      const files=[],used=new Set();
      for(let i=0;i<svgs.length;i++){
        const b=await sheetBlob(svgs[i],jpg);
        const t=(cards[i].querySelector('.tt').value.trim()||(i+1)+'번째 판').replace(/[\\/:*?"<>|]/g,'_');
        let n=t,k=2;while(used.has(n))n=t+' ('+(k++)+')';used.add(n);
        files.push({name:n+'.'+ext,data:new Uint8Array(await b.arrayBuffer())});
      }
      download(makeZip(files),base+'.zip');
      sm.textContent=base+'.zip 저장 ('+svgs.length+'장)';
    }
  }catch(e){sm.textContent='이미지를 만들지 못했습니다.';}
}
